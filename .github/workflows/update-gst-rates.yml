name: Update GST Rates

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 8 AM UTC
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GST rates update script
        id: check
        env:
          GST_RATE_SOURCE_URL: ${{ vars.GST_RATE_SOURCE_URL }}
        run: |
          result=$(node scripts/update-gst-rates.js --check)
          echo "$result"
          if [[ "$result" == *"GST_RATE_CHANGED=true"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review issue when rates differ
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Bot] Authoritative GST rate changes require review',
              body: `The configured authoritative workbook differs from the committed GST rate data. No repository files were changed.\n\nReview workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automated']
            });

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Bot] GST rates update failed on ${new Date().toISOString().split('T')[0]}`,
              body: `The weekly GST rates update job failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check the logs and manually run the update if needed.`,
              labels: ['bug', 'automated']
            });
