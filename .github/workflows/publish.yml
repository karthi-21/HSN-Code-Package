name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Run tests before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mints the OIDC token npm trades for publish rights
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never publish from a restored cache
      - run: npm ci
      - run: npm publish --access public
